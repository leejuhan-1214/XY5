name: Test and deploy XY5 research workbench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy Pillow
      - run: python tests/test_research_data.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish runtime files only: no tests, build scripts, Python, CI config or the
      # duplicated urban-heat-potential-lab copy. The legacy simulator stays reachable.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' --exclude '.gitignore' \
            --exclude 'tests' --exclude 'scripts' --exclude 'python' --exclude 'package.json' \
            --exclude 'urban-heat-potential-lab' \
            --exclude 'data/observations.json' --exclude 'data/buildings.geojson'
          du -sh _site && find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
